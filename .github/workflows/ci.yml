name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration-тесты (шаг 7) ходят в настоящий Postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kvarta
          POSTGRES_PASSWORD: kvarta
          POSTGRES_DB: kvarta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvarta -d kvarta_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      DATABASE_URL_UNPOOLED: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      DATABASE_URL_TEST: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      IP_HASH_SALT: ci-only-salt
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm – из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test --reporter=dot

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
