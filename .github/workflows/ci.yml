name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration-тесты (шаг 7) ходят в настоящий Postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kvarta
          POSTGRES_PASSWORD: kvarta
          POSTGRES_DB: kvarta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvarta -d kvarta_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      DATABASE_URL_UNPOOLED: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      DATABASE_URL_TEST: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      IP_HASH_SALT: ci-only-salt
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm – из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test --reporter=dot

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Заявки из тестов идут через настоящий API в базу
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kvarta
          POSTGRES_PASSWORD: kvarta
          POSTGRES_DB: kvarta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvarta -d kvarta_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL_TEST: postgres://kvarta:kvarta@localhost:5432/kvarta_test
      IP_HASH_SALT: ci-only-salt
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Мобильный проект – WebKit (iPhone 13), десктоп – Chromium
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # Тесты идут против прод-сборки (next start), как на Vercel
      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Главная статическая, база ей не нужна. Порт – как в lighthouserc.json,
    # чтобы canonical и ссылки указывали на проверяемый сервер
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Chrome уже есть в образе ubuntu-latest. Железо CI слабее, поэтому
      # порог performance 0,9; итоговый замер – PageSpeed Insights по проду.
      # LCP – по лучшему из 3 прогонов, порог 3,5 с: на localhost вся загрузка
      # занимает ~50 мс, и симуляция на одном и том же коде даёт от 2,3 до 4,3 с.
      # Порог ловит регрессию; бюджет ТЗ (2,0 с) проверяем в PageSpeed Insights
      - name: Lighthouse CI
        run: pnpm lhci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
