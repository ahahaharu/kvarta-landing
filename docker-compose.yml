services:
  db:
    image: postgres:17-alpine
    container_name: kvarta-db
    environment:
      POSTGRES_USER: kvarta
      POSTGRES_PASSWORD: kvarta
      POSTGRES_DB: kvarta
    ports:
      - "5433:5432" # 5433 на маке, чтобы не конфликтовать с другим Postgres
    volumes:
      - kvarta-pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvarta -d kvarta"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kvarta-pg:
